apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "geth-swap.fullname" . }}-test-connection"
  labels:
    {{- include "geth-swap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['geth-swap:{{ .Values.service.port }}']
  restartPolicy: Never
